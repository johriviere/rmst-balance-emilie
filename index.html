<!doctype html>
<html lang="fr">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   La balance d'Émilie — Atelier
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="app">
   <header class="panel header">
    <h1>
     La balance d’Émilie
    </h1>
    <p id="phase-title">
     Phase 1 : situation initiale
    </p>
   </header>
   <div class="workspace">
    <section aria-label="Cartes à placer" class="panel cards-panel">
     <div aria-live="polite" class="cards" id="cards">
     </div>
     <!-- Boutons de contrôle, maintenus en bas du panneau grâce au flex CSS -->
     <div class="panel-footer">
      <button class="next" disabled="" id="next" type="button">
       Démarrer la seconde phase
      </button>
      <button aria-label="Recommencer l’atelier" class="reset" id="reset" type="button">
       Recommencer
      </button>
     </div>
    </section>
    <section aria-label="Balance interactive" class="panel balance-panel">
     <div class="balance-status">
      <span aria-live="polite" class="status is-balanced" id="status" role="status">
       La balance est équilibrée
      </span>
     </div>
     <div class="balance-stage" id="stage">
      <svg aria-hidden="true" class="drawing" preserveaspectratio="none" viewbox="0 0 900 600">
       <ellipse cx="450" cy="560" fill="#e8eef3" rx="145" ry="11">
       </ellipse>
       <path d="M439 161 H461 L472 530 H428 Z" fill="#d3e1ec">
       </path>
       <path d="M422 530 H478 L501 551 H399 Z" fill="#a9bfd2">
       </path>
       <path d="M398 553 H502" stroke="#7d9cb2" stroke-linecap="round" stroke-width="8">
       </path>
       <g class="beam" id="beam">
        <line stroke="#67869e" stroke-linecap="round" stroke-width="13" x1="210" x2="690" y1="160" y2="160">
        </line>
        <circle cx="210" cy="160" fill="#80b37a" r="10">
        </circle>
        <circle cx="690" cy="160" fill="#e77a8b" r="10">
        </circle>
       </g>
       <path fill="none" id="ropes-left" stroke="#91b69b" stroke-width="2.5">
       </path>
       <path fill="none" id="ropes-right" stroke="#d7a0ad" stroke-width="2.5">
       </path>
       <circle cx="450" cy="160" fill="#466f90" r="18">
       </circle>
       <circle cx="450" cy="160" fill="#fff" r="7">
       </circle>
      </svg>
      <div class="pan resources" id="pan-left">
       <div class="pan-header">
        <span>
         Ressources
        </span>
        <span class="count" id="left-weight">
         0
        </span>
       </div>
       <div class="pan-items" id="left-items">
       </div>
      </div>
      <div class="pan constraints" id="pan-right">
       <div class="pan-header">
        <span>
         Contraintes
        </span>
        <span class="count" id="right-weight">
         0
        </span>
       </div>
       <div class="pan-items" id="right-items">
       </div>
      </div>
     </div>
    </section>
   </div>
  </main>
  <script defer="" src="app.js">
  </script>
 </body>
</html>
